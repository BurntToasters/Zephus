<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline';"
    />
    <title>Zephus</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        background: #09090b;
        color: #f4f4f5;
        overflow: hidden;
        user-select: none;
      }

      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 24px;
        box-sizing: border-box;
        text-align: center;
      }

      .title {
        margin: 0;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }

      .status {
        margin: 0;
        font-size: 13px;
        color: #a1a1aa;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1 class="title">Zephus</h1>
      <p class="status">Loading…</p>
    </div>
  </body>
</html>
