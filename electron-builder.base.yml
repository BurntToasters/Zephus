appId: run.rosie.zephus
productName: Zephus
asar: true
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  onlyLoadAppFromAsar: true
files:
  - "dist/**/*"
  - "template-previews/dist/**/*"
  - "src/renderer/index.html"
  - "src/renderer/splash.html"
  - "src/renderer/styles.css"
  - "src/renderer/zephusEngine.js"
  - "licenses.json"
  - "!**/node_modules/*/{test,__tests__,tests}/**"
  - "!**/*.md"
  - "!**/*.map"
  - "!dist/test/**"
  - "!dist/shared/blockRenderFixtures.js"
directories:
  output: release
publish:
  provider: github
  owner: BurntToasters
  repo: zephus
win:
  target: nsis
  icon: build/app-icon.ico
  # Signature verification for downloaded updates requires publisherName;
  # enabled once the certificate subject matches (kept off until then so
  # unsigned dev builds do not hard-fail the updater).
  verifyUpdateCodeSignature: false
nsis:
  artifactName: Zephus-Windows-${arch}.${ext}
  allowToChangeInstallationDirectory: false
  oneClick: false
  perMachine: false
  # Without publisherName, Windows installers show "Unknown Publisher" at UAC
  # and electron-updater cannot verify downloaded updates (it skips signature
  # checks entirely). Name must match the Authenticode certificate subject.
  publisherName: BurntToasters
mac:
  target:
    - dmg
    - zip
  icon: build/app-icon.icns
  artifactName: Zephus-MacOS-universal.${ext}
  # Hardened runtime + entitlements in BASE: build:mac:* (base only) used to
  # produce unsigned, never-notarized builds that Gatekeeper rejects on other
  # machines. The github release config inherits these and adds notarize.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
linux:
  target:
    - AppImage
    - deb
    - rpm
  icon: build/app-icon.png
  category: Development
  syncDesktopName: true
appImage:
  artifactName: Zephus-Linux-${arch}.${ext}
deb:
  artifactName: Zephus-Linux-${arch}.${ext}
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
rpm:
  artifactName: Zephus-Linux-${arch}.${ext}
  depends:
    - gtk3
    - libnotify
    - nss
    - libXScrnSaver
    - libXtst
    - at-spi2-core
    - libuuid
    - libsecret
dmg:
  background: build/dmg-background.png
  icon: build/app-icon.png
  iconSize: 100
  contents:
    - x: 120
      "y": 300
      type: file
    - x: 546
      "y": 300
      type: link
      path: /Applications
  window:
    width: 648
    height: 480
