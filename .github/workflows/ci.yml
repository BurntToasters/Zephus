name: CI

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "26.13.0"
  NPM_VERSION: "12.2.1"
  CARGO_AUDIT_VERSION: "0.22.2"

jobs:
  commit-message-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install latest npm 12
        run: npm install --global npm@${{ env.NPM_VERSION }} --ignore-scripts --min-release-age=3
      - name: Enforce Co-authored-by email policy
        run: node scripts/strip-coauthor-trailers.mjs --check-range ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
      - name: Enforce stable metadata-only main PR
        if: >-
          ${{
            github.event.pull_request.base.ref == 'main' &&
            startsWith(github.head_ref, 'release/')
          }}
        run: >-
          node scripts/check-stable-metadata-pr.mjs
          ${{ github.event.pull_request.base.sha }}
          ${{ github.event.pull_request.head.sha }}

  quality-gate:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install latest npm 12
        run: npm install --global npm@${{ env.NPM_VERSION }} --ignore-scripts --min-release-age=3
      - name: Read pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: |
          set -euo pipefail
          channel="$(node scripts/rust-toolchain.mjs)"
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          components: rustfmt, clippy
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            appstream \
            desktop-file-utils \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xvfb
      - run: npm ci --ignore-scripts
      - name: Strict Cargo license notices
        run: npm run licenses:cargo:strict
      - name: Quality gate
        env:
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
        run: npm run test:all -- --skip-smoke --skip-coverage --skip-e2e

  rust-check:
    needs: quality-gate
    if: ${{ success() && github.event_name != 'schedule' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install latest npm 12
        run: npm install --global npm@${{ env.NPM_VERSION }} --ignore-scripts --min-release-age=3
      - name: Read pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: |
          set -euo pipefail
          channel="$(node scripts/rust-toolchain.mjs)"
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
      - run: npm ci --ignore-scripts
      - run: node scripts/npm-audit-signatures.cjs
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml

  updater-manifest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install latest npm 12
        run: npm install --global npm@${{ env.NPM_VERSION }} --ignore-scripts --min-release-age=3
      - run: npm run validate:updater
      - name: Published updater feed sanity
        run: npm run validate:updater:live

  smoke-build:
    needs: quality-gate
    if: ${{ success() && github.event_name != 'schedule' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            triple: x86_64-unknown-linux-gnu
            binary: zephus
          - os: macos-26
            triple: aarch64-apple-darwin
            binary: zephus
          - os: macos-26-intel
            triple: x86_64-apple-darwin
            binary: zephus
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            binary: zephus.exe
          - os: windows-11-arm
            triple: aarch64-pc-windows-msvc
            binary: zephus.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install latest npm 12
        run: npm install --global npm@${{ env.NPM_VERSION }} --ignore-scripts --min-release-age=3
      - name: Read pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: |
          set -euo pipefail
          channel="$(node scripts/rust-toolchain.mjs)"
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf
      - run: npm ci --ignore-scripts
      - run: node scripts/npm-audit-signatures.cjs
      - run: npm run sync-version
      - name: Verify synchronized version files are committed
        run: git diff --exit-code
      - run: npm run licenses
      - name: Unsigned tauri build (no bundle)
        run: npx tauri build --no-bundle
      - name: Verify smoke binary
        shell: bash
        run: test -e "src-tauri/target/release/${{ matrix.binary }}"

  security-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install latest npm 12
        run: npm install --global npm@${{ env.NPM_VERSION }} --ignore-scripts --min-release-age=3
      - name: Read pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: |
          set -euo pipefail
          channel="$(node scripts/rust-toolchain.mjs)"
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
      - run: npm ci --ignore-scripts
      - run: node scripts/npm-audit-signatures.cjs
      - name: npm audit - production
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit - reviewed dev toolchain
        run: npm run audit:dev-reviewed
      - name: RustSec ignore review policy
        run: npm run check:rustsec-ignore-policy
      - name: Install cargo-audit
        run: cargo install cargo-audit --version ${{ env.CARGO_AUDIT_VERSION }} --locked
      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit
      - name: Vendored tauri-plugin-updater version and advisory check
        run: node scripts/check-vendored-updater.mjs

  ci-gate:
    if: ${{ always() }}
    needs:
      - commit-message-policy
      - quality-gate
      - rust-check
      - updater-manifest
      - smoke-build
      - security-audit
    runs-on: ubuntu-24.04
    steps:
      - name: Require every release check
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_MESSAGE_POLICY: ${{ needs.commit-message-policy.result }}
          QUALITY_GATE: ${{ needs.quality-gate.result }}
          RUST_CHECK: ${{ needs.rust-check.result }}
          UPDATER_MANIFEST: ${{ needs.updater-manifest.result }}
          SMOKE_BUILD: ${{ needs.smoke-build.result }}
          SECURITY_AUDIT: ${{ needs.security-audit.result }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          RELEASE_PROMOTION_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' && startsWith(github.head_ref, 'next-') }}
          STABLE_METADATA_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main' && startsWith(github.head_ref, 'release/') }}
        run: |
          set -euo pipefail
          test "$UPDATER_MANIFEST" = success
          test "$SECURITY_AUDIT" = success
          if [ "$EVENT_NAME" = schedule ]; then
            test "$QUALITY_GATE" = skipped
            test "$RUST_CHECK" = skipped
            test "$SMOKE_BUILD" = skipped
            test "$COMMIT_MESSAGE_POLICY" = skipped
            exit 0
          fi
          test "$QUALITY_GATE" = success
          test "$RUST_CHECK" = success
          test "$SMOKE_BUILD" = success
          test "$PR_BASE_REF" != "main" || test "$RELEASE_PROMOTION_PR" = "true" || test "$STABLE_METADATA_PR" = "true"
          if [ "$EVENT_NAME" = pull_request ]; then
            test "$COMMIT_MESSAGE_POLICY" = success
          else
            test "$COMMIT_MESSAGE_POLICY" = skipped
          fi
